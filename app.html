<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Linkfunn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f5ff;--ink:#1e1646;--muted:#5b5578;--pink:#e4268b;--green:#1f9d55;--soft:#ffe3f2;--card:#fff;--line:#e1dcf3;
--head:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;--body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
@media(prefers-color-scheme:dark){:root{--bg:#14102e;--ink:#f3f0ff;--muted:#b4add4;--soft:#3a1a4d;--card:#1d1842;--line:#2f2a5c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 var(--body);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:focus-visible{outline:3px solid var(--pink);outline-offset:3px;border-radius:6px}
.wrap{max-width:560px;margin:0 auto;padding:0 20px 40px}
header{display:flex;justify-content:space-between;align-items:center;padding:20px 0}
.logo{font-family:var(--head);font-weight:800;font-size:24px;letter-spacing:-.02em}.logo span{color:var(--pink)}
h1{font-family:var(--head);font-weight:800;font-size:32px;line-height:1.1;letter-spacing:-.02em;margin:8px 0 6px}
p.sub{color:var(--muted);margin:0 0 20px}
.box{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px}
label{display:block;font-weight:500;font-size:15px;margin-bottom:14px}
input[type=text],input[type=email],input[type=password],select,textarea{display:block;width:100%;margin-top:6px;padding:13px 14px;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:12px}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--pink);outline:none}
.btn{width:100%;font:inherit;font-weight:700;font-size:17px;color:#fff;background:var(--pink);border:0;border-radius:14px;padding:14px;cursor:pointer}
.btn.alt{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
.btn:disabled{opacity:.6}
.link{background:none;border:0;color:var(--pink);font:inherit;font-weight:700;cursor:pointer;padding:6px 0}
.small{font-size:14px;color:var(--muted)}
.msg{min-height:1.4em;color:var(--pink);font-size:15px;margin:10px 0 0}
.or{text-align:center;color:var(--muted);font-size:14px;margin:16px 0}
.age{display:flex;gap:10px;align-items:flex-start;font-weight:400;color:var(--muted);font-size:14px}
.age input{margin-top:4px;width:18px;height:18px;accent-color:var(--pink);flex:none}
.cards{display:grid;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}
.card h2{font-family:var(--head);font-size:22px;margin:0 0 2px}
.tag{display:inline-block;font-size:13px;font-weight:700;color:var(--green);border:1.5px solid var(--green);border-radius:99px;padding:1px 10px;margin-right:6px}
.meta{color:var(--muted);font-size:14px;margin:4px 0 8px}
.card p{margin:0}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
<header><div class="logo">Link<span>funn</span></div><button class="link" id="out" hidden>Sign out</button></header>

<section id="auth" hidden>
  <h1 id="at">Sign in to Linkfunn</h1>
  <p class="sub">18 and over only.</p>
  <div class="box">
    <button class="btn alt" id="g" type="button">Continue with Google</button>
    <p class="or">or use your email</p>
    <form id="ef" novalidate>
      <label>Email<input type="email" id="em" autocomplete="email" required></label>
      <label>Password<input type="password" id="pw" autocomplete="current-password" minlength="6" required></label>
      <button class="btn" id="eb" type="submit">Sign in</button>
    </form>
    <button class="link" id="tg" type="button">New here? Create an account</button>
    <p class="msg" id="am" role="status" aria-live="polite"></p>
  </div>
</section>

<section id="profile" hidden>
  <h1>Set up your profile</h1>
  <p class="sub">This is what other people see.</p>
  <form class="box" id="pf" novalidate>
    <label>First name or nickname<input type="text" id="dn" maxlength="40" required></label>
    <label>I am a
      <select id="ge"><option value="woman">Woman</option><option value="man">Man</option></select></label>
    <label>Interested in
      <select id="ii"><option value="everyone">Everyone</option><option value="woman">Women</option><option value="man">Men</option></select></label>
    <label>Are you part of FUNAAB?
      <select id="ac"><option value="funaab">Yes (student, alumni or staff)</option><option value="outside">No, I’m outside</option></select></label>
    <label id="dl">Department<input type="text" id="dp" maxlength="60"></label>
    <label>City<input type="text" id="ct" maxlength="60" placeholder="e.g. Abeokuta"></label>
    <label>Looking for
      <select id="lf"><option value="relationship">A relationship</option><option value="friends">Friends</option><option value="study">A study partner</option></select></label>
    <label>About you<textarea id="bi" maxlength="200" placeholder="A line or two about you"></textarea></label>
    <label class="age"><input type="checkbox" id="ov" required> I’m 18 or older.</label>
    <button class="btn" id="pb" type="submit">Save profile</button>
    <p class="msg" id="pm" role="status" aria-live="polite"></p>
  </form>
</section>

<section id="browse" hidden>
  <h1 id="hi">Welcome</h1>
  <p class="sub">People who have joined Linkfunn.</p>
  <div class="cards" id="cards"></div>
</section>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, collection, query, where, limit, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyCM9005wPsG59mcUN_UlhCIdUrNrSYOm5w",
  authDomain: "funaab-connect-bae8e.firebaseapp.com",
  projectId: "funaab-connect-bae8e",
  storageBucket: "funaab-connect-bae8e.firebasestorage.app",
  messagingSenderId: "808262376505",
  appId: "1:808262376505:web:cc3252ee5812d0b3b681e8"
});
const auth = getAuth(app), db = getFirestore(app);
const $ = id => document.getElementById(id);
const show = v => { for (const x of ["auth","profile","browse"]) $(x).hidden = x !== v; $("out").hidden = v === "auth"; };
let creating = false, me = null;

function authErr(e){
  const m = {"auth/email-already-in-use":"That email already has an account. Sign in instead.",
    "auth/invalid-credential":"Wrong email or password.","auth/invalid-email":"Enter a valid email.",
    "auth/weak-password":"Use a password with at least 6 characters.","auth/popup-closed-by-user":"Sign-in was cancelled.",
    "auth/unauthorized-domain":"This website address isn’t authorized in Firebase yet.","auth/network-request-failed":"No connection. Try again."};
  $("am").textContent = m[e.code] || "Couldn’t sign in. Try again.";
}

$("tg").onclick = () => {
  creating = !creating;
  $("at").textContent = creating ? "Create your account" : "Sign in to Linkfunn";
  $("eb").textContent = creating ? "Create account" : "Sign in";
  $("tg").textContent = creating ? "Already have an account? Sign in" : "New here? Create an account";
  $("pw").autocomplete = creating ? "new-password" : "current-password";
  $("am").textContent = "";
};
$("g").onclick = () => signInWithPopup(auth, new GoogleAuthProvider()).catch(authErr);
$("ef").onsubmit = async e => {
  e.preventDefault(); $("am").textContent = "";
  const em = $("em").value.trim(), pw = $("pw").value;
  if (!em || !pw) return $("am").textContent = "Enter your email and password.";
  try { creating ? await createUserWithEmailAndPassword(auth, em, pw) : await signInWithEmailAndPassword(auth, em, pw); }
  catch (err) { authErr(err); }
};
$("out").onclick = () => signOut(auth);
$("ac").onchange = () => { $("dl").hidden = $("ac").value !== "funaab"; };

function el(tag, cls, text){ const n = document.createElement(tag); if (cls) n.className = cls; if (text) n.textContent = text; return n; }
const looking = {relationship:"Looking for a relationship", friends:"Looking for friends", study:"Looking for a study partner"};

async function loadBrowse(uid){
  $("hi").textContent = "Hi, " + me.displayName;
  const box = $("cards"); box.textContent = "";
  const snap = await getDocs(query(collection(db, "profiles"), where("isInvisible", "==", false), limit(40)));
  let n = 0;
  snap.forEach(d => {
    const p = d.data();
    if (d.id === uid) return;
    if (me.interestedIn !== "everyone" && p.gender !== me.interestedIn) return;
    if (p.interestedIn !== "everyone" && p.interestedIn !== me.gender) return;
    const c = el("div", "card"); c.append(el("h2", "", p.displayName));
    const meta = el("div", "meta");
    if (p.accountType === "funaab" && p.funaabVerified) { meta.append(el("span", "tag", "FUNAAB")); }
    meta.append(document.createTextNode([p.accountType === "funaab" ? p.department : "", p.city, looking[p.lookingFor]].filter(Boolean).join(", ")));
    c.append(meta); if (p.bio) c.append(el("p", "", p.bio));
    box.append(c); n++;
  });
  if (!n) box.append(el("p", "small", "No one else has joined yet. Share Linkfunn and check back soon."));
}

$("pf").onsubmit = async e => {
  e.preventDefault(); const u = auth.currentUser, msg = $("pm"); msg.textContent = "";
  const dn = $("dn").value.trim();
  if (dn.length < 2) return msg.textContent = "Enter a name with at least 2 characters.";
  if (!$("ov").checked) return msg.textContent = "You must be 18 or older.";
  const data = { displayName: dn, gender: $("ge").value, interestedIn: $("ii").value, accountType: $("ac").value,
    department: $("ac").value === "funaab" ? $("dp").value.trim() : "", city: $("ct").value.trim(),
    bio: $("bi").value.trim(), lookingFor: $("lf").value, over18: true, isInvisible: false, funaabVerified: false,
    createdAt: serverTimestamp(), updatedAt: serverTimestamp() };
  $("pb").disabled = true;
  try { await setDoc(doc(db, "profiles", u.uid), data); me = data; await loadBrowse(u.uid); show("browse"); }
  catch (err) { console.error(err); msg.textContent = "Couldn’t save your profile. Check your connection and try again."; }
  finally { $("pb").disabled = false; }
};

onAuthStateChanged(auth, async u => {
  if (!u) { me = null; return show("auth"); }
  try {
    const s = await getDoc(doc(db, "profiles", u.uid));
    if (s.exists()) { me = s.data(); await loadBrowse(u.uid); show("browse"); } else show("profile");
  } catch (err) { console.error(err); show("auth"); $("am").textContent = "Couldn’t load your account. Try again."; }
});
</script>
</body>
</html>
